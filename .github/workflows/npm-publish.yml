name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify release version
        id: package
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Git tag $GITHUB_REF_NAME != package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version &>/dev/null; then
            echo "::error::$name@$version already published"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check, test & pack
        run: npm run prepack && npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
